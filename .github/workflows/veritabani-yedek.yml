name: Veritabanı Yedeği

# Paket 26 B — her gece veritabanı dökümü.
#
# Neden: ücretsiz Supabase planında otomatik yedek YOK (YEDEKLEME.md, panelden
# doğrulandı). Yedek bugüne kadar yalnız elle alınıyordu ve hiç alınmamıştı.
#
# Kurallar:
#  - Döküm DEPOYA COMMİT EDİLMEZ; Actions artifact olarak 14 gün saklanır.
#    (Depo şişmez, oyuncu verisi git geçmişine düşmez.)
#  - Bağlantı dizgisi yalnız GitHub Secrets'ta durur: SUPABASE_DB_URL.
#    Bu dosyaya hiçbir sır yazılmaz.
#  - "Denenmemiş yedek, yedek değildir": döküm HER GECE boş bir Postgres 17
#    kabına gerçekten geri yüklenir ve tablo başına satır sayıları kaynakla
#    karşılaştırılır. Tutmazsa iş KIRILIR.
#  - Kırılırsa sessiz kalmaz: depoda "Gece yedeği başarısız" başlıklı bir konu
#    açılır/güncellenir (e-posta bildirimi de gider).

on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC = 03:00 TSİ
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  testler:
    uses: ./.github/workflows/testler.yml
    # Yeniden kullanılan iş, çağıranın sırlarını KENDİLİĞİNDEN ALMAZ.
    # Bu satır olmadan sunucu testleri sessizce atlanıyordu (18 Eyl 2026'da ölçüldü:
    # "43 skipped" — yani iş yeşil görünürken hiçbir şey denenmemişti).
    secrets: inherit

  yedek:
    name: Döküm + geri yükleme doğrulaması
    runs-on: ubuntu-latest

    services:
      hedef:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gerialma
          POSTGRES_DB: gerialma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      HEDEF_URL: postgresql://postgres:gerialma@localhost:5432/gerialma

    steps:
      - name: PostgreSQL 17 istemcisi
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Runner'da Ubuntu'nun kendi PostgreSQL 16 istemcisi ÖNCE geliyor ve
          # pg_dump 17.6 sunucuya "server version mismatch" diyerek düşüyordu
          # (18 Eyl 2026'da ölçüldü). Sürüme özel dizin PATH'in başına alınıyor.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Sürüm kontrolü
        run: |
          pg_dump --version
          psql --version
          case "$(pg_dump --version)" in *" 17."*) ;; *) echo "pg_dump 17 bekleniyordu"; exit 1;; esac

      - name: Bağlantı sırrı tanımlı mı
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL sırrı tanımlı değil."
            echo "Depo > Settings > Secrets and variables > Actions altına eklenmeli."
            exit 1
          fi

      # Sayım dökümden HEMEN ÖNCE alınır: pg_dump kendi anlık görüntüsüyle çalışır
      # ve canlıda botlar saniyede yazar. İkisi arasındaki küçük kayma normaldir,
      # karşılaştırma adımı bunu hesaba katıyor.
      - name: Kaynak satır sayıları
        env:
          KAYNAK_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$KAYNAK_URL" -At -F '|' -f - > kaynak-sayim.txt <<'SQL'
          select c.relname,
                 (xpath('/row/c/text()',
                        query_to_xml(format('select count(*) c from public.%I', c.relname),
                                     false, true, '')))[1]::text::bigint
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
           where n.nspname = 'public' and c.relkind = 'r'
           order by c.relname;
          SQL
          wc -l kaynak-sayim.txt

      - name: Döküm al
        env:
          KAYNAK_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "DAMGA=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"
          pg_dump "$KAYNAK_URL" \
            --schema=public --schema=auth --schema=cron \
            --no-owner --no-privileges \
            -Fc -f yedek.dump
          ls -lh yedek.dump

      - name: Hedefi hazırla
        run: |
          set -euo pipefail
          # Döküm auth.uid(), `authenticated` rolü, `extensions` şeması gibi
          # Supabase'e özel nesnelere dayanıyor; boş kapta hiçbiri yok. İlk koşuda
          # ölçüldü: bunlar kurulmayınca pg_restore 112 hatayı atlıyordu (veri değil,
          # RLS politikaları ve yabancı anahtarlar). İskeletler kurulunca döküm
          # POLİTİKALARIYLA BİRLİKTE geri yükleniyor, yani doğrulama daha sıkı.
          psql "$HEDEF_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create extension if not exists "uuid-ossp";
          create schema if not exists auth;
          create schema if not exists cron;
          create schema if not exists net;
          create schema if not exists extensions;
          -- questions üzerindeki trigram indeksi extensions.gin_trgm_ops istiyor.
          create extension if not exists pg_trgm schema extensions;
          do $$
          begin
            -- RLS politikalarının "to authenticated" kısmı bu roller olmadan kurulamaz.
            create role anon nologin;            exception when duplicate_object then null;
          end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role nologin; exception when duplicate_object then null; end $$;
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create or replace function auth.role() returns text language sql stable as $$ select null::text $$;
          create or replace function auth.jwt() returns jsonb language sql stable as $$ select '{}'::jsonb $$;
          SQL

      - name: Geri yükle (public + auth)
        run: |
          set -uo pipefail
          # `auth` da geri yükleniyor: oyuncu HESAPLARI orada ve yedeğin asıl
          # doldurulamaz kısmı o. Ayrıca profiles.id -> auth.users(id) yabancı
          # anahtarı ancak hesaplar varken kurulabiliyor.
          # Hatalar burada durdurmuyor: boş kapta pg_cron / pg_net gibi eklentilere
          # bağlı nesneler kurulamaz. Asıl kapı bir sonraki adımdaki satır sayısı
          # karşılaştırmasıdır — veri eksikse iş orada kırılır.
          pg_restore --no-owner --no-privileges --schema=public --schema=auth \
            -d "$HEDEF_URL" yedek.dump 2> geri-yukleme-hatalari.log || true
          echo "geri yükleme uyarı/hata satırı: $(wc -l < geri-yukleme-hatalari.log)"
          echo "--- hata türleri ---"
          grep -oE 'ERROR:  [^"]*("[^"]*")?' geri-yukleme-hatalari.log | sort | uniq -c | sort -rn | head -10 || true

      - name: Hesaplar geri geldi mi
        env:
          KAYNAK_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          K=$(psql "$KAYNAK_URL" -At -c 'select count(*) from auth.users')
          H=$(psql "$HEDEF_URL" -At -c 'select count(*) from auth.users')
          echo "auth.users — kaynak $K, geri yüklenen $H"
          if [ "$K" != "$H" ]; then
            echo "HESAPLAR EKSİK GERİ YÜKLENDİ — yedek kullanılamaz"
            exit 1
          fi
          echo "Hesaplar doğrulandı."

      - name: Satır sayılarını karşılaştır
        run: |
          set -euo pipefail
          psql "$HEDEF_URL" -At -F '|' -f - > hedef-sayim.txt <<'SQL'
          select c.relname,
                 (xpath('/row/c/text()',
                        query_to_xml(format('select count(*) c from public.%I', c.relname),
                                     false, true, '')))[1]::text::bigint
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
           where n.nspname = 'public' and c.relkind = 'r'
           order by c.relname;
          SQL

          diff -u kaynak-sayim.txt hedef-sayim.txt > sayim-farki.txt || true
          echo "--- tablo başına fark (boşsa birebir aynı) ---"
          cat sayim-farki.txt

          # Üç kapı. Hiçbiri "yaklaşık" değil, hepsi sayıya bakar:
          #  1. Tablo kümesi birebir aynı olmalı — eksik tablo = eksik yedek.
          #  2. Kaynakta dolu olan hiçbir tablo geri yüklemede boş kalmamalı.
          #  3. Toplam satır farkı %1'i aşmamalı. Bu pay, döküm ile sayım arasında
          #     botların yazdığı satırlar içindir; gerçek bir veri kaybını gizleyecek
          #     kadar büyük değildir.
          awk -F'|' '
            FNR==NR { k[$1]=$2; ktop+=$2; next }
                    { h[$1]=$2; htop+=$2 }
            END {
              hata=0
              for (t in k) if (!(t in h)) { print "EKSİK TABLO: " t; hata=1 }
              for (t in h) if (!(t in k)) { print "FAZLA TABLO: " t; hata=1 }
              for (t in k) if (k[t]>0 && h[t]+0==0) { print "BOŞ GERİ YÜKLENDİ: " t " (kaynak " k[t] ")"; hata=1 }
              fark = ktop - htop; if (fark < 0) fark = -fark
              pay = (ktop>0) ? fark*100.0/ktop : 0
              printf "toplam satır — kaynak %d, geri yüklenen %d, fark %d (%%%.3f)\n", ktop, htop, fark, pay
              if (pay > 1.0) { print "TOPLAM FARK %1 SINIRINI AŞTI"; hata=1 }
              if (hata) { print "GERİ YÜKLEME DOĞRULANAMADI"; exit 1 }
              print "Geri yükleme doğrulandı."
            }
          ' kaynak-sayim.txt hedef-sayim.txt

      - name: Dökümü sakla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veritabani-yedek-${{ env.DAMGA }}
          path: |
            yedek.dump
            kaynak-sayim.txt
          retention-days: 14
          if-no-files-found: error

      - name: Hata kaydını sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yedek-hata-gunlugu
          path: |
            geri-yukleme-hatalari.log
            kaynak-sayim.txt
            hedef-sayim.txt
            sayim-farki.txt
          retention-days: 14
          if-no-files-found: ignore

  bildir:
    name: Başarısızsa görünür ol
    needs: [testler, yedek]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const baslik = 'Gece yedeği başarısız';
            const govde = [
              'Gece veritabanı yedeği işi başarısız oldu.',
              '',
              `Çalıştırma: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Yedek alınamadıysa ya da geri yükleme doğrulaması tutmadıysa',
              'o geceye ait yedek YOKTUR. Günlüğü açıp sebebi bul.',
            ].join('\n');
            const acik = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'yedekleme',
            });
            const var_olan = acik.data.find(i => i.title === baslik);
            if (var_olan) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: var_olan.number, body: govde,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: baslik, body: govde, labels: ['yedekleme'],
              });
            }
