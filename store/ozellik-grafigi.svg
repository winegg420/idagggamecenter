<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-label="Bildim! özellik grafiği">
  <defs>
    <linearGradient id="zm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f1f6b"/>
      <stop offset="55%" stop-color="#160f33"/>
      <stop offset="100%" stop-color="#0b0918"/>
    </linearGradient>
    <radialGradient id="isk" cx="22%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="isk2" cx="82%" cy="78%" r="50%">
      <stop offset="0%" stop-color="#ffc83d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffc83d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yazi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="55%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#ffc83d"/>
    </linearGradient>
    <linearGradient id="tuy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gvd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
