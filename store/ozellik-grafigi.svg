      <rect width="228" height="52" rx="26" fill="none" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="26" y="33" fill="#f3f0ff">⚔️  1v1 Meydan Okuma</text>
    </g>
    <g transform="translate(320 300)">
      <rect width="196" height="52" rx="26" fill="#ffffff" opacity="0.09"/>
      <rect width="196" height="52" rx="26" fill="none" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="26" y="33" fill="#f3f0ff">🏆  Günlük Turnuva</text>
    </g>
    <g transform="translate(76 368)">
      <rect width="168" height="52" rx="26" fill="#ffffff" opacity="0.09"/>
      <rect width="168" height="52" rx="26" fill="none" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="26" y="33" fill="#f3f0ff">🏙️  Şehir Ligi</text>
    </g>
    <g transform="translate(260 368)">
      <rect width="256" height="52" rx="26" fill="#ffc83d" opacity="0.16"/>
      <rect width="256" height="52" rx="26" fill="none" stroke="#ffc83d" stroke-opacity="0.6"/>
