  </defs>

  <rect width="1024" height="500" fill="url(#zm)"/>
  <rect width="1024" height="500" fill="url(#isk)"/>
  <rect width="1024" height="500" fill="url(#isk2)"/>

  <!-- nokta dokusu -->
  <g fill="#ffffff" opacity="0.05">
