    <circle cx="520" cy="70" r="2"/><circle cx="760" cy="140" r="2"/>
    <circle cx="900" cy="60" r="2"/><circle cx="180" cy="330" r="2"/>
    <circle cx="420" cy="420" r="2"/><circle cx="660" cy="360" r="2"/>
    <circle cx="960" cy="300" r="2"/><circle cx="60" cy="200" r="2"/>
  </g>

  <!-- Maskot -->
  <g transform="translate(690 96) scale(2.75)">
    <ellipse cx="50" cy="62" rx="30" ry="32" fill="url(#gvd)"/>
    <ellipse cx="50" cy="70" rx="19" ry="21" fill="#ede9fe" opacity="0.92"/>
    <path d="M26 58c-8-4-15-1-17 6 5 5 13 5 18 0" stroke="#5b21b6" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M74 58c8-4 15-1 17 6-5 5-13 5-18 0" stroke="#5b21b6" stroke-width="7" stroke-linecap="round" fill="none"/>
    <ellipse cx="50" cy="38" rx="31" ry="27" fill="url(#tuy)"/>
    <path d="M24 20c2 6 6 10 11 12-4-7-6-11-11-12z" fill="#6d28d9"/>
    <path d="M76 20c-2 6-6 10-11 12 4-7 6-11 11-12z" fill="#6d28d9"/>
    <circle cx="38" cy="37" r="13" fill="#faf5ff"/>
    <circle cx="62" cy="37" r="13" fill="#faf5ff"/>
    <path d="M32 38c3-5 9-5 12 0" stroke="#1f1147" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M56 38c3-5 9-5 12 0" stroke="#1f1147" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M50 44l-5 7h10l-5-7z" fill="#ffc83d"/>
    <path d="M42 92v5M46 92v5M54 92v5M58 92v5" stroke="#ffc83d" stroke-width="3" stroke-linecap="round"/>
    <path d="M14 22l2.6 6.4L23 31l-6.4 2.6L14 40l-2.6-6.4L5 31l6.4-2.6z" fill="#ffc83d"/>
